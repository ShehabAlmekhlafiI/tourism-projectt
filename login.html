<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - الموقع السياحي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="tttt">
        <h1>صفحه تسجيل الدخول</h1>
        <a href="index.html">العودة للصفحة الرئيسية</a>
    </header>
    <div class="container mt-5" style="max-width: 450px;">
        
        
        <div id="login-section" class="card p-4 shadow">
            <h2 class="text-center mb-3">تسجيل الدخول</h2>
            
         <div class="mb-3">
                <label>البريد الإلكتروني:</label>
                <input type="email" id="login-email" class="form-control" placeholder="ادخل الإيميل">
         </div>
            
            <div class="mb-3">
                <label>كلمة المرور:</label>
                <input type="password" id="login-password" class="form-control" placeholder="ادخل الباسورد">
            </div>

            <button type="button" class="btn btn-primary w-100 mb-3" onclick="loginUser()">دخول</button>
            <p class="text-center">ليس لديك حساب؟ <a href="#" onclick="showRegister(event)">أنشئ حساباً جديداً</a></p>
        </div>

        <div id="register-section" class="card p-4 shadow" style="display: none;">
            <h2 class="text-center mb-3">إنشاء حساب جديد</h2>
            
            <div class="mb-3">
                <label>الاسم:</label>
                <input type="text" id="reg-name" class="form-control" placeholder="ادخل اسمك">
            </div>

            <div class="mb-3">
                <label>البريد الإلكتروني:</label>
                <input type="email" id="reg-email" class="form-control" placeholder="ادخل الإيميل">
            </div>
            
            <div class="mb-3">
                <label>كلمة المرور:</label>
                <input type="password" id="reg-password" class="form-control" placeholder="كلمة المرور">
            </div>

            <button type="button" class="btn btn-success w-100 mb-3" onclick="registerUser()">إنشاء الحساب</button>
            <p class="text-center">لديك حساب بالفعل؟ <a href="#" onclick="showLogin(event)">تسجيل الدخول</a></p>
        </div>

    </div>

    <script>
        function showRegister(e) {
            e.preventDefault();
            document.getElementById("login-section").style.display = "none";
            document.getElementById("register-section").style.display = "block";
        }

        function showLogin(e) {
            e.preventDefault();
            document.getElementById("register-section").style.display = "none";
            document.getElementById("login-section").style.display = "block";
        }

        function registerUser() {
            let name = document.getElementById("reg-name").value.trim();
            let email = document.getElementById("reg-email").value.trim();
            let password = document.getElementById("reg-password").value.trim();

            if (name === "" || email === "" || password === "") {
                alert("الرجاء تعبئة جميع الحقول!");
                return;
            }

            localStorage.setItem("userEmail", email);
            localStorage.setItem("userPassword", password);
            localStorage.setItem("userName", name);

            alert("تم إنشاء الحساب بنجاح! سجل دخولك الآن.");
            
            document.getElementById("register-section").style.display = "none";
            document.getElementById("login-section").style.display = "block";
        }

        function loginUser() {
            let email = document.getElementById("login-email").value.trim();
            let password = document.getElementById("login-password").value.trim();

            if (email === "" || password === "") {
                alert("الرجاء تعبئة جميع الحقول!");
                return;
            }

            let savedEmail = localStorage.getItem("userEmail");
            let savedPass = localStorage.getItem("userPassword");

            if ((email === savedEmail && password === savedPass) || (email === "shehab@gmail.com" && password === "123456")) {
                alert("تم تسجيل الدخول بنجاح!");
                window.location.href = "index.html";
            } else {
                alert("البريد أو كلمة المرور غير صحيحة، أو أنك لم تنشئ حساباً بعد!");
            }
        }
    </script>
</body>
</html>
