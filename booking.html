<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز الغرف - الموقع السياحي</title>
     <link rel="stylesheet" href="css/style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<header id="gggg">
         <h1>حجز الغرف والفنادق</h1>
     <a href="index.html" class="back-link">العودة للصفحة الرئيسية</a>
</header>
    <div class="container">
   
        <div class="form-group">
            <label>اختر نوع الغرفة:</label>
          <select id="roomType" class="form-control">
    <option value="">اختر نوع الغرفة</option>
    <option value="فردية">غرفة فردية - فاخرة</option>
    <option value="مزدوجة">غرفة مزدوجة - إطلالة على البحر</option>
    <option value="ملكي">جناح ملكي متكامل</option>
</select>


<label>تاريخ الوصول:</label>
<input type="text" id="arrivalDate" class="form-control" placeholder="حدد تاريخ الوصول">


<label>تاريخ المغادرة:</label>
<input type="text" id="departureDate" class="form-control" placeholder="حدد تاريخ المغادرة">
<button type="button" class="btn btn-primary" onclick="showBookingToast()">تأكيد الحجز</button>
        
    </div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
  <div id="bookingToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header bg-success text-white">
      <strong class="me-auto">تم الحجز</strong>
      <small>الآن</small>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
    <div class="toast-body">
      <div class="toast-body text-dark fw-bold">
    تم تأكيد حجزك بنجاح يا المهندس شهاب! نتمنى لك إقامة سعيدة.
</div
    
    </div>
  </div>
</div>
    

<script>
  function showBookingToast() {
    var room = document.getElementById('roomType').value;
    var arrival = document.getElementById('arrivalDate').value;
    var departure = document.getElementById('departureDate').value;

    if (room === "" || arrival === "" || departure === "") {
        alert("يا المهندس شهاب، الرجاء تعبئة جميع بيانات الحجز أولاً!");
    } else {
        var toastElement = document.getElementById('bookingToast');
        var toast = new bootstrap.Toast(toastElement);
        toast.show();
    }
  }
</script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
